<!doctype html>
<html><head><meta charset="utf-8"><title>PTV reel</title>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js"}}</script>
<style>
  html,body{margin:0;background:#000;overflow:hidden}
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden}
  canvas{display:block;width:1080px;height:1920px}
  /* Instagram safe zone: nothing in top 220px, bottom 380px (y>1540), right 120px (x>960) */
  :root{--accent:#ffd27a}
  .out{-webkit-text-stroke:14px #0b0b12;paint-order:stroke fill;stroke-linejoin:round}
  #year{position:absolute;left:60px;top:240px;font:900 128px/1 "Inter","DejaVu Sans",sans-serif;color:#fff;letter-spacing:-4px;
        font-variant-numeric:tabular-nums;-webkit-text-stroke:12px #0b0b12;paint-order:stroke fill;transform-origin:left center;
        text-shadow:0 8px 0 rgba(0,0,0,.25)}
  #card{position:absolute;left:60px;width:840px;bottom:500px;text-align:center;font:900 98px/1.0 "Inter","DejaVu Sans",sans-serif;color:#fff;
        text-transform:uppercase;white-space:pre-line;opacity:0}
  #txt{display:block;-webkit-text-stroke:16px #0b0b12;paint-order:stroke fill;stroke-linejoin:round;letter-spacing:-1px;text-shadow:0 10px 0 rgba(0,0,0,.3)}
  #txt .w{display:inline-block;margin:0 .13em;opacity:0;transform-origin:50% 80%}
  #txt .hl{color:var(--accent)}
  #cta{margin-top:30px;font:900 56px/1.1 "Inter","DejaVu Sans",sans-serif;color:var(--accent);-webkit-text-stroke:10px #0b0b12;paint-order:stroke fill;opacity:0;text-transform:none}
</style></head>
<body><div id="stage"><canvas id="c" width="1080" height="1920"></canvas>
<div id="year">2026</div>
<div id="card"><div id="txt"></div><div id="cta"></div></div></div>
<script type="module" src="/main.js"></script></body></html>
